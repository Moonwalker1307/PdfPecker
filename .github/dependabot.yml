# Weekly pull requests when a pinned GitHub Action, a test package, the veraPDF validator or PdfPecker.Razor's
# Microsoft package gets a new version. The library has no package references, and the two comparison benchmarks are left out on purpose: their competitor
# versions are the ones the published benchmark tables were measured with.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # CodeQL refuses to run when its init and analyze steps are on different versions, so they must move together.
    groups:
      codeql-action:
        patterns: ["github/codeql-action*"]

  # The veraPDF validator the conformance workflow runs.
  - package-ecosystem: maven
    directory: /tools/ConformanceSamples/verapdf
    schedule:
      interval: weekly

  - package-ecosystem: nuget
    directory: /tests/PdfPecker.Tests
    schedule:
      interval: weekly
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /tests/PdfPecker.Fluent.Tests
    schedule:
      interval: weekly
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  # PdfPecker.Razor's one package, Microsoft.AspNetCore.Components.Web. Each target framework references the release of
  # its own .NET version on purpose, so only patches are proposed: a major update would move net8.0 or net9.0 to a newer
  # ASP.NET Core than the app's runtime.
  - package-ecosystem: nuget
    directory: /src/PdfPecker.Razor
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      aspnetcore-patches:
        update-types: [patch]

  - package-ecosystem: nuget
    directory: /tests/PdfPecker.Razor.Tests
    schedule:
      interval: weekly
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: nuget
    directory: /tests/PdfPecker.Cli.Tests
    schedule:
      interval: weekly
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
