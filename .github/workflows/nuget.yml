name: NuGet package

on:
  pull_request:
    paths:
      - src/**
      - tests/**
      - samples/**
      - bench/**
      - tools/**
      - README.md
      - THIRD-PARTY-NOTICES.md
      - PdfPecker.sln
      - .github/workflows/nuget.yml
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - samples/**
      - bench/**
      - tools/**
      - README.md
      - THIRD-PARTY-NOTICES.md
      - PdfPecker.sln
      - .github/workflows/nuget.yml
  release:
    types: [published]
  workflow_dispatch:

# Least privilege: jobs only read the repository; the release job alone may attach files to a release,
# and the publish job alone may request an OIDC token for NuGet Trusted Publishing.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Actions are pinned to commits so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the release tags give preview builds their version

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            version="${TAG#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Release tag '$TAG' is not a version like v1.2.3 or 1.2.3-beta"
              exit 1
            fi
          else
            # Previews take the major.minor of the latest release, so they sort above it: 1.1.<run>-preview after v1.1.0.
            latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
            prefix=$(echo "${latest#v}" | grep -oE '^[0-9]+\.[0-9]+' || true)
            version="${prefix:-1.0}.$GITHUB_RUN_NUMBER-preview"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version" >> "$GITHUB_STEP_SUMMARY"

      - run: dotnet build -c Release -p:Version=${{ steps.version.outputs.version }}
      - run: dotnet test -c Release --no-build
      - run: dotnet pack src/PdfPecker -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PdfPecker.${{ steps.version.outputs.version }}.nupkg
          path: artifacts/*.nupkg

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PdfPecker.${{ needs.build.outputs.version }}.nupkg
          path: artifacts

      - name: Attach package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" artifacts/*.nupkg --clobber

  # Pushes the release package to nuget.org with Trusted Publishing: NuGet/login swaps a GitHub OIDC token
  # for a short-lived API key, so no long-lived key is stored in the repository. Runs only for published releases.
  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PdfPecker.${{ needs.build.outputs.version }}.nupkg
          path: artifacts

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Check nuget.org user is set
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Set the repository variable NUGET_USER to the nuget.org account that owns the Trusted Publishing policy"
            exit 1
          fi

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
