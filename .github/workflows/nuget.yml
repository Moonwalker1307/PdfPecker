name: NuGet package

on:
  # Every pull request is built and tested, so the checks can be made required without a PR that touches other
  # files waiting for checks that never start.
  pull_request:
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - samples/**
      - bench/**
      - tools/**
      - README.md
      - THIRD-PARTY-NOTICES.md
      - PdfPecker.sln
      - global.json
      - .github/workflows/nuget.yml
  release:
    types: [published]
  workflow_dispatch:

# Least privilege: jobs only read the repository; the release job alone may attach files to a release,
# and the publish job alone may request an OIDC token for NuGet Trusted Publishing.
permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main are never cancelled, so every merged commit gets a
# result even when two pull requests merge close together.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Actions are pinned to commits so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the release tags give preview builds their version

      # The package targets net8.0, net9.0 and net10.0, and the tests run on each runtime.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Compute version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            version="${TAG#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Release tag '$TAG' is not a version like v1.2.3 or 1.2.3-beta"
              exit 1
            fi
          else
            # Previews are pre-releases of the next patch after the latest release, so NuGet sorts them above it and
            # below the next release: 1.1.1-preview.<run> after v1.1.0.
            latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
            if [[ "${latest#v}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              next="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            else
              next="1.0.0"
            fi
            version="$next-preview.$GITHUB_RUN_NUMBER"
            # Package validation compares the API with this baseline, so it must move to each new release; otherwise a
            # break against the latest release goes unnoticed.
            baseline=$(sed -n 's:.*<PackageValidationBaselineVersion>\(.*\)</PackageValidationBaselineVersion>.*:\1:p' src/PdfPecker/PdfPecker.csproj)
            if [ -n "$latest" ] && [ "$baseline" != "${latest#v}" ]; then
              echo "::warning file=src/PdfPecker/PdfPecker.csproj::PackageValidationBaselineVersion is $baseline but the latest release is ${latest#v}; raise it."
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version" >> "$GITHUB_STEP_SUMMARY"

      - run: dotnet build -c Release -p:Version=${{ steps.version.outputs.version }}
      - run: dotnet test -c Release --no-build

      - run: dotnet pack src/PdfPecker -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PdfPecker.${{ steps.version.outputs.version }}.nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  # Coverage runs the net10.0 tests a second time with instrumentation, so it has a job of its own that runs alongside
  # the build job instead of adding two minutes after its tests.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - run: dotnet build -c Release -f net10.0 tests/PdfPecker.Tests

      # Coverage never fails the build: instrumentation makes the tests that bound their run time (hostile input,
      # damaged streams) many times slower, so they are left out and the step may not fail the job.
      - name: Coverage
        continue-on-error: true
        run: dotnet test -c Release --no-build -f net10.0 tests/PdfPecker.Tests --filter "FullyQualifiedName!~HostileInputTests&FullyQualifiedName!~TimeBoundTests&FullyQualifiedName!~FuzzFindingTests" --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Coverage summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import xml.etree.ElementTree as ET
          reports = glob.glob("coverage/*/coverage.cobertura.xml")
          if reports:
              print(f"Line coverage: {float(ET.parse(reports[0]).getroot().get('line-rate')):.1%} (net10.0 tests)")
          else:
              print("No coverage report was produced.")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/**/coverage.cobertura.xml

  # Build and tests on Windows, for net10.0 only, because paths, fonts and line endings differ there.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - run: dotnet build -c Release -f net10.0 tests/PdfPecker.Tests
      - run: dotnet test -c Release -f net10.0 --no-build tests/PdfPecker.Tests

  # IsAotCompatible only turns on the analyzers; publishing and running the sample as a native executable proves the
  # library really works trimmed and ahead-of-time compiled.
  native-aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Publish the sample with native AOT
        run: dotnet publish samples/PdfPecker.Sample -c Release -p:PublishAot=true -p:TreatWarningsAsErrors=true -o aot

      - name: Convert the sample documents
        run: |
          ./aot/PdfPecker.Sample aot/html aot-output
          test "$(ls aot-output/*.pdf | wc -l)" -ge 1

  release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PdfPecker.${{ needs.build.outputs.version }}.nupkg
          path: artifacts

      - name: Attach package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" artifacts/*.nupkg --clobber

  # Pushes the release package to nuget.org with Trusted Publishing: NuGet/login swaps a GitHub OIDC token
  # for a short-lived API key, so no long-lived key is stored in the repository. Runs only for published releases.
  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: PdfPecker.${{ needs.build.outputs.version }}.nupkg
          path: artifacts

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Check nuget.org user is set
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Set the repository variable NUGET_USER to the nuget.org account that owns the Trusted Publishing policy"
            exit 1
          fi

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
