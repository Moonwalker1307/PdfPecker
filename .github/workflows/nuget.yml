name: NuGet package

on:
  # Every pull request is built and tested, so the checks can be made required without a PR that touches other
  # files waiting for checks that never start.
  pull_request:
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - samples/**
      - bench/**
      - tools/**
      - README.md
      - THIRD-PARTY-NOTICES.md
      - PdfPecker.sln
      - global.json
      - .github/workflows/nuget.yml
  release:
    types: [published]
  workflow_dispatch:

# Least privilege: jobs only read the repository; the release job alone may attach files to a release,
# and the publish job alone may request an OIDC token for NuGet Trusted Publishing.
permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main are never cancelled, so every merged commit gets a
# result even when two pull requests merge close together.
# A PR's newer push replaces its older run. Every push to main runs on its own: with one group for main, GitHub keeps
# only the newest waiting run and cancels the others, so commits merged minutes apart got no result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Actions are pinned to commits so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the release tags give preview builds their version

      # The package targets net8.0, net9.0 and net10.0, and the tests run on each runtime.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          # Keeps ~/.nuget/packages between runs. Every restore of src/PdfPecker fetches the API baseline release for
          # package validation, so without the cache each job downloaded it from nuget.org again. A release builds
          # without it: the packages it publishes come from a fresh restore from nuget.org, not from a cache that an
          # earlier run on main saved and could have altered.
          cache: ${{ github.event_name != 'release' }}
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - name: Compute version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            version="${TAG#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Release tag '$TAG' is not a version like v1.2.3 or 1.2.3-beta"
              exit 1
            fi
          else
            # Previews are pre-releases of the next patch after the latest release, so NuGet sorts them above it and
            # below the next release: 1.1.1-preview.<run> after v1.1.0.
            latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
            if [[ "${latest#v}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              next="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            else
              next="1.0.0"
            fi
            version="$next-preview.$GITHUB_RUN_NUMBER"
            # Package validation compares the API with this baseline, so it must move to each new release; otherwise a
            # break against the latest release goes unnoticed.
            baseline=$(sed -n 's:.*<PackageValidationBaselineVersion>\(.*\)</PackageValidationBaselineVersion>.*:\1:p' src/PdfPecker/PdfPecker.csproj)
            if [ -n "$latest" ] && [ "$baseline" != "${latest#v}" ]; then
              echo "::warning file=src/PdfPecker/PdfPecker.csproj::PackageValidationBaselineVersion is $baseline but the latest release is ${latest#v}; raise it."
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version" >> "$GITHUB_STEP_SUMMARY"

      - run: dotnet build -c Release -p:Version=${{ steps.version.outputs.version }}
      - run: dotnet test -c Release --no-build

      # PdfPecker.Fluent, PdfPecker.Testing and PdfPecker.Razor are released with every PdfPecker release, with the same
      # version, and depend on that version.
      - run: dotnet pack src/PdfPecker -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts
      - run: dotnet pack src/PdfPecker.Fluent -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts
      - run: dotnet pack src/PdfPecker.Testing -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts
      - run: dotnet pack src/PdfPecker.Razor -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts

      # PdfPecker.Cli is the `pdfpecker` dotnet tool. It carries PdfPecker's assembly inside the package, so it has no
      # dependencies, and it gets the same version as the other packages. This job writes the package itself, whose
      # net10.0 folder names the Native AOT package of each platform, and PdfPecker.Cli.any, the framework-dependent
      # tool a .NET 10 SDK installs on other platforms; the tool-packages job writes the native ones.
      - run: dotnet pack src/PdfPecker.Cli -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts
      - run: dotnet pack src/PdfPecker.Cli -c Release -r any -p:Version=${{ steps.version.outputs.version }} -o artifacts

      # .NET 8 and 9 SDKs reject the per-platform layout and install the framework-dependent tool from the package's
      # folder of their own version instead. A successful pack does not show that, so each of them installs the package
      # into a throwaway tool path and converts a document; global.json picks the SDK.
      - name: Install the tool with the .NET 8 and 9 SDKs and use it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for sdk in 8.0 9.0; do
            mkdir -p "tool-check-$sdk"
            echo "{\"sdk\":{\"version\":\"$sdk.100\",\"rollForward\":\"latestFeature\"}}" > "tool-check-$sdk/global.json"
            (cd "tool-check-$sdk" && dotnet --version && dotnet tool install PdfPecker.Cli --tool-path tool --add-source ../artifacts --version "$VERSION")
            echo '<h1>Tool check</h1>' | "./tool-check-$sdk/tool/pdfpecker" convert - "tool-check-$sdk/check.pdf"
            "./tool-check-$sdk/tool/pdfpecker" text "tool-check-$sdk/check.pdf" | grep -q 'Tool check'
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ steps.version.outputs.version }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          # About 15 MB a run, and artifact storage is shared by the account's repositories. Release builds keep the
          # default, and every release has its packages attached anyway.
          retention-days: ${{ github.event_name == 'release' && 90 || 7 }}

  # Coverage runs the net10.0 tests a second time with instrumentation, so it has a job of its own that runs alongside
  # the build job instead of adding two minutes after its tests. It runs for main rather than for every pull request:
  # the figure is followed over time, and a PR's tests already run in the build job.
  coverage:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - run: dotnet build -c Release -f net10.0 tests/PdfPecker.Tests

      # Coverage never fails the build: instrumentation makes the tests that bound their run time (hostile input,
      # damaged streams) many times slower, so they are left out and the step may not fail the job.
      - name: Coverage
        continue-on-error: true
        run: dotnet test -c Release --no-build -f net10.0 tests/PdfPecker.Tests --filter "FullyQualifiedName!~HostileInputTests&FullyQualifiedName!~TimeBoundTests&FullyQualifiedName!~FuzzFindingTests" --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Coverage summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import xml.etree.ElementTree as ET
          reports = glob.glob("coverage/*/coverage.cobertura.xml")
          if reports:
              print(f"Line coverage: {float(ET.parse(reports[0]).getroot().get('line-rate')):.1%} (net10.0 tests)")
          else:
              print("No coverage report was produced.")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/**/coverage.cobertura.xml
          retention-days: 7

  # Build and tests on Windows, for net10.0 only, because paths, fonts and line endings differ there.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - run: dotnet build -c Release -f net10.0 tests/PdfPecker.Tests
      - run: dotnet test -c Release -f net10.0 --no-build tests/PdfPecker.Tests
      - run: dotnet build -c Release -f net10.0 tests/PdfPecker.Fluent.Tests
      - run: dotnet test -c Release -f net10.0 --no-build tests/PdfPecker.Fluent.Tests
      - run: dotnet build -c Release -f net10.0 tests/PdfPecker.Cli.Tests
      - run: dotnet test -c Release -f net10.0 --no-build tests/PdfPecker.Cli.Tests
      # Snapshot paths, file names and the files a failure writes depend on the file system.
      - run: dotnet build -c Release -f net10.0 tests/PdfPecker.Testing.Tests
      - run: dotnet test -c Release -f net10.0 --no-build tests/PdfPecker.Testing.Tests
      - run: dotnet build -c Release -f net10.0 tests/PdfPecker.Razor.Tests
      - run: dotnet test -c Release -f net10.0 --no-build tests/PdfPecker.Razor.Tests

  # IsAotCompatible only turns on the analyzers; publishing and running the samples as native executables proves the
  # packages really work trimmed and ahead-of-time compiled.
  native-aot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - name: Publish the sample with native AOT
        run: dotnet publish samples/PdfPecker.Sample -c Release -p:PublishAot=true -p:TreatWarningsAsErrors=true -o aot

      - name: Convert the sample documents
        run: |
          ./aot/PdfPecker.Sample aot/html aot-output
          test "$(ls aot-output/*.pdf | wc -l)" -ge 1

      - name: Publish the Fluent sample with native AOT
        run: dotnet publish samples/PdfPecker.Fluent.Sample -c Release -p:PublishAot=true -p:TreatWarningsAsErrors=true -o aot-fluent

      - name: Generate the Fluent examples
        run: |
          ./aot-fluent/PdfPecker.Fluent.Sample aot-fluent-output
          test "$(ls aot-fluent-output/*.pdf | wc -l)" -ge 5

      # Warnings stay errors here; the sample's project file lets through only Microsoft.AspNetCore.Components' own.
      - name: Publish the Razor sample with native AOT
        run: dotnet publish samples/PdfPecker.Razor.Sample -c Release -p:PublishAot=true -p:TreatWarningsAsErrors=true -o aot-razor

      - name: Convert the Razor invoice
        run: |
          ./aot-razor/PdfPecker.Razor.Sample aot-razor-output
          test "$(head -c 5 aot-razor-output/invoice.pdf)" = "%PDF-"
          grep -q "Template design &lt;draft &amp; final&gt;" aot-razor-output/invoice.html

  # The pdfpecker tool's Native AOT packages, PdfPecker.Cli.<rid>. Native AOT compiles only for the operating system
  # it runs on, so each platform packs on its own runner (arm64 on arm64 runners; Alpine's musl ones in the SDK's
  # Alpine image), then installs the tool from the full set of packages and converts a document with it. osx-x64 is
  # compiled on the arm64 Mac, which cannot run it.
  tool-packages:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: linux-musl-x64, os: ubuntu-latest, alpine: true }
          - { rid: linux-musl-arm64, os: ubuntu-24.04-arm, alpine: true }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-latest, cross: true }
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.build.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: ${{ !matrix.alpine }}
        with:
          dotnet-version: 10.0.x
          # These packages are published too, so a release packs them from a fresh restore, as the build job does.
          cache: ${{ github.event_name != 'release' }}
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - name: Pack the native tool
        if: ${{ !matrix.alpine }}
        run: dotnet pack src/PdfPecker.Cli -c Release -r ${{ matrix.rid }} -p:Version="$VERSION" -o tool-packages

      # JavaScript actions do not run in Alpine job containers, so the pack and the check run in the SDK's Alpine images
      # directly. A pull from mcr.microsoft.com sometimes times out, so it is tried three times before the job fails.
      - name: Pull the Alpine SDK images
        if: ${{ matrix.alpine }}
        run: |
          for image in sdk:10.0-alpine-aot sdk:10.0-alpine; do
            for attempt in 1 2 3; do
              docker pull -q "mcr.microsoft.com/dotnet/$image" && break
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 15
            done
          done

      - name: Pack the native tool for Alpine
        if: ${{ matrix.alpine }}
        run: >
          docker run --rm -v "$PWD:/src" -w /src -e GITHUB_ACTIONS mcr.microsoft.com/dotnet/sdk:10.0-alpine-aot
          dotnet pack src/PdfPecker.Cli -c Release -r ${{ matrix.rid }} -p:Version="$VERSION" -o tool-packages

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !matrix.cross }}
        with:
          name: packages-${{ needs.build.outputs.version }}
          path: tool-feed

      - name: Install the tool from the packages and use it
        if: ${{ !matrix.cross && !matrix.alpine }}
        run: |
          cp tool-packages/*.nupkg tool-feed/
          dotnet tool install PdfPecker.Cli --tool-path tool-check --add-source tool-feed --version "$VERSION"
          # On Windows the SDK starts a native tool through a pdfpecker.cmd shim, which cmd and PowerShell find on their
          # own but bash only by its full name.
          pdfpecker=./tool-check/pdfpecker
          if [ "$RUNNER_OS" = Windows ]; then pdfpecker=./tool-check/pdfpecker.cmd; fi
          echo '<h1>Tool check</h1>' | "$pdfpecker" convert - tool-check/check.pdf
          "$pdfpecker" text tool-check/check.pdf | grep -q 'Tool check'
          # The command must come from this platform's native package, not from the framework-dependent fallback.
          test -n "$(find tool-check/.store -type d -name 'pdfpecker.cli.${{ matrix.rid }}')"

      - name: Install the tool from the packages on Alpine and use it
        if: ${{ matrix.alpine }}
        run: |
          cp tool-packages/*.nupkg tool-feed/
          docker run --rm -v "$PWD:/src" -w /src -e VERSION mcr.microsoft.com/dotnet/sdk:10.0-alpine sh -ec '
            dotnet tool install PdfPecker.Cli --tool-path /tmp/tool --add-source tool-feed --version "$VERSION"
            echo "<h1>Tool check</h1>" | /tmp/tool/pdfpecker convert - /tmp/check.pdf
            /tmp/tool/pdfpecker text /tmp/check.pdf | grep -q "Tool check"
            test -n "$(find /tmp/tool/.store -type d -name pdfpecker.cli.${{ matrix.rid }})"'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tool-${{ matrix.rid }}-${{ needs.build.outputs.version }}
          path: tool-packages/*.nupkg
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'release' && 90 || 7 }}

  release:
    if: github.event_name == 'release'
    needs: [build, tool-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-${{ needs.build.outputs.version }}
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tool-*-${{ needs.build.outputs.version }}
          merge-multiple: true
          path: artifacts

      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" artifacts/*.nupkg --clobber

  # Pushes the release packages, PdfPecker, PdfPecker.Fluent, PdfPecker.Testing, PdfPecker.Cli (with its platform packages) and PdfPecker.Razor, to nuget.org with Trusted Publishing: NuGet/login swaps a GitHub OIDC token
  # for a short-lived API key, so no long-lived key is stored in the repository. Runs only for published releases.
  publish:
    if: github.event_name == 'release'
    needs: [build, tool-packages]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-${{ needs.build.outputs.version }}
          path: artifacts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tool-*-${{ needs.build.outputs.version }}
          merge-multiple: true
          path: artifacts

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Check nuget.org user is set
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Set the repository variable NUGET_USER to the nuget.org account that owns the Trusted Publishing policy"
            exit 1
          fi

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      # PdfPecker.Cli goes last: a .NET 10 SDK that finds it looks for the platform package it names, so those must be
      # there first.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tool="artifacts/PdfPecker.Cli.$VERSION.nupkg"
          test -f "$tool"
          for package in artifacts/*.nupkg; do
            if [ "$package" != "$tool" ]; then
              dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
            fi
          done
          dotnet nuget push "$tool" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
