name: Fuzz

# Nightly, and on demand. Deliberately not on pull requests: a fuzz run is random, so it must not decide whether a
# change can merge. A finding fails the job and uploads the minimised inputs; see fuzz/README.md.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to fuzz each target
        default: "10"
      target:
        description: One target name, or "all" (see fuzz/README.md for the names)
        default: all

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    if: ${{ github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false # one target's finding must not stop the others
      matrix:
        target:
          - pdf-render
          - pdf-text
          - pdf-merge
          - pdf-form
          - pdf-verify
          - html
          - css
          - svg
          - markdown
          - png
          - jpeg
          - gif
          - webp
          - bmp
          - tiff
          - jpx
          - jbig2
          - font-ttf
          - font-otf
          - font-woff
          - font-woff2
          - font-variable
    steps:
      # Actions are pinned to commits so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build the fuzzer
        run: dotnet build -c Release fuzz/PdfPecker.Fuzz

      # The seed is the run id, so every night explores different inputs; a finding names its seed in its .txt file, and
      # --repro on the saved input reproduces it without the seed.
      - name: Fuzz ${{ matrix.target }}
        env:
          MINUTES: ${{ inputs.minutes || '10' }}
          TARGET: ${{ matrix.target }}
          SEED: ${{ github.run_id }}
        run: >
          dotnet fuzz/PdfPecker.Fuzz/bin/Release/net10.0/PdfPecker.Fuzz.dll
          --target "$TARGET" --duration "${MINUTES}m" --seed "$SEED" --out fuzz-findings

      - name: Upload findings
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: fuzz-findings/
          if-no-files-found: ignore
          retention-days: 30
