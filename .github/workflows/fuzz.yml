name: Fuzz

# Nightly, and on demand. Deliberately not on pull requests: a fuzz run is random, so it must not decide whether a
# change can merge. A finding fails the job and uploads the minimised inputs; see fuzz/README.md.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to fuzz each target
        default: "10"
      target:
        description: One target name, or "all" (see fuzz/README.md for the names)
        default: all

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # A job-level `if` cannot read the matrix, so the targets to run are chosen here and handed to the fuzz job as its
  # matrix: every target on the schedule or for "all", otherwise only the one asked for.
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          ALL: >-
            fluent pdf-render pdf-text pdf-html pdf-merge pdf-form pdf-compact pdf-verify html css svg markdown barcode png jpeg gif webp bmp tiff jpx jbig2 font-ttf font-otf font-woff font-woff2 font-variable
          TARGET: ${{ github.event_name == 'schedule' && 'all' || inputs.target }}
        run: |
          if [ "$TARGET" = "all" ]; then
            picked="$ALL"
          elif [[ " $ALL " == *" $TARGET "* ]]; then
            picked="$TARGET"
          else
            echo "::error::Unknown fuzz target '$TARGET'; use one of: $ALL, or all"
            exit 1
          fi
          json=$(printf '%s\n' $picked | jq -R . | jq -cs .)
          echo "matrix=$json" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false # one target's finding must not stop the others
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      # Actions are pinned to commits so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          # Keeps ~/.nuget/packages between runs. Every restore of src/PdfPecker fetches the API baseline release for
          # package validation, so without the cache each job downloaded it from nuget.org again.
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - name: Build the fuzzer
        if: matrix.target != 'fluent'
        run: dotnet build -c Release fuzz/PdfPecker.Fuzz

      # The seed is the run id, so every night explores different inputs; a finding names its seed in its .txt file, and
      # --repro on the saved input reproduces it without the seed. --jobs runs one worker per core, each with its own
      # seed, because a single worker leaves the other cores of the runner idle.
      - name: Fuzz ${{ matrix.target }}
        if: matrix.target != 'fluent'
        env:
          MINUTES: ${{ inputs.minutes || '10' }}
          TARGET: ${{ matrix.target }}
          SEED: ${{ github.run_id }}
        run: >
          dotnet fuzz/PdfPecker.Fuzz/bin/Release/net10.0/PdfPecker.Fuzz.dll
          --target "$TARGET" --duration "${MINUTES}m" --seed "$SEED" --jobs "$(nproc)" --out fuzz-findings

      # PdfPecker.Fluent has its own generative fuzzer, which builds random documents from fluent calls instead of
      # mutating files. It runs on one core and saves no inputs: a failing case is reproduced from the seed and its
      # number with --case. Its seed is a 32-bit number, so the run id is folded into that range.
      - name: Fuzz fluent
        if: matrix.target == 'fluent'
        env:
          MINUTES: ${{ inputs.minutes || '10' }}
          RUN_ID: ${{ github.run_id }}
        run: |
          dotnet build -c Release fuzz/PdfPecker.Fluent.Fuzz
          dotnet fuzz/PdfPecker.Fluent.Fuzz/bin/Release/net10.0/PdfPecker.Fluent.Fuzz.dll --seconds "$((MINUTES * 60))" --seed "$((RUN_ID % 2147483647))"

      # Artifacts are not reachable from every place a finding gets triaged, and the inputs are small, so each finding's
      # report and its input (base64) also go into the log and the job summary.
      - name: Print findings
        if: ${{ failure() }}
        run: |
          shopt -s nullglob
          for txt in fuzz-findings/*/*.txt; do
            input="$(dirname "$txt")/$(sed -n 's/^input: \([^ ]*\).*/\1/p' "$txt")"
            {
              echo "### $txt"
              echo '```'
              head -c 4000 "$txt"
              echo
              echo "base64 of $input:"
              base64 -w0 "$input" | head -c 200000
              echo
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload findings
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: fuzz-findings/
          if-no-files-found: ignore
          retention-days: 30
