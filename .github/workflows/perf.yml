name: Performance

# Runs the short benchmark nightly on main and compares it with the previous run, so a slowdown or an allocation
# increase is noticed within a day instead of at the next release.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # lists and downloads the previous run's artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          # Keeps ~/.nuget/packages between runs. Every restore of src/PdfPecker fetches the API baseline release for
          # package validation, so without the cache each job downloaded it from nuget.org again.
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      - run: dotnet build -c Release bench/PdfPecker.Benchmarks

      # The GC sizes its youngest generation from the processor's cache, so without a fixed size the allocation-heavy
      # cases collect more often on some runner models than on others and their times stop being comparable.
      - name: Run the benchmark
        env:
          DOTNET_GCgen0size: "0x4000000"
        # It runs twice and each case keeps its better time, so that a busy minute on a shared runner during one case
        # does not read as a regression of that case; see .github/scripts/perf-best.py.
        run: |
          dotnet bench/PdfPecker.Benchmarks/bin/Release/net10.0/PdfPecker.Benchmarks.dll --perf perf.json
          dotnet bench/PdfPecker.Benchmarks/bin/Release/net10.0/PdfPecker.Benchmarks.dll --perf perf-again.json
          python3 -I .github/scripts/perf-best.py perf.json perf-again.json

      # The newest earlier run is the baseline for allocation, and the newest earlier run on the same processor model
      # the baseline for time, as hosted runners come in several models whose times are not comparable. A run counts
      # whether it passed or failed: a regression fails the night it lands, and the nights after compare with it, so a
      # cost that is meant, such as a new feature's work, fails once instead of every night until the next change. A
      # run that left no results, such as one whose build failed, is skipped. A first run, or one whose artifacts have
      # expired, has no baseline and passes.
      - name: Download the previous results
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          cpu=$(jq -r '.cpu // empty' perf.json)
          runs=$(gh run list --workflow perf.yml --branch main --status completed --limit 20 --json databaseId --jq '.[].databaseId' || true)
          for id in $runs; do
            [ "$id" = "$RUN_ID" ] && continue
            rm -rf candidate
            gh run download "$id" --name perf-results --dir candidate 2>/dev/null || continue
            [ -f candidate/perf.json ] || continue
            if [ ! -f baseline/perf.json ]; then
              mkdir -p baseline && cp candidate/perf.json baseline/perf.json && echo "Allocation baseline: run $id"
            fi
            if [ -n "$cpu" ] && [ "$(jq -r '.cpu // empty' candidate/perf.json)" = "$cpu" ]; then
              cp candidate/perf.json baseline/time.json && echo "Time baseline: run $id"
              break
            fi
          done
          rm -rf candidate
          if [ ! -f baseline/perf.json ]; then echo "No baseline found."; fi

      - name: Compare with the baseline
        run: |
          args=(perf.json)
          if [ -f baseline/perf.json ]; then args+=(baseline/perf.json); fi
          if [ -f baseline/time.json ]; then args+=(baseline/time.json); fi
          set +e
          python3 .github/scripts/perf-compare.py "${args[@]}" | tee perf-summary.md
          status=${PIPESTATUS[0]}
          { echo "## Performance"; echo; cat perf-summary.md; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-results
          path: |
            perf.json
            perf-summary.md
          retention-days: 90
