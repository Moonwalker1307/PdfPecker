name: .NET preview

# Builds and tests PdfPecker on the latest .NET 11 preview SDK and packs a preview package with an extra net11.0
# target, so a break in the next .NET shows up long before it ships. The released package keeps net8.0, net9.0 and
# net10.0 only until .NET 11 is generally available. The job never blocks a pull request or a release: preview SDKs
# change between drops, and a failure here is a heads-up, not a reason to hold back a stable release.
on:
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: "41 4 * * 1" # Mondays, so a new preview drop is tried within a week
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PREVIEW_TFM: net11.0

jobs:
  net11:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      # global.json pins the .NET 10 SDK; this run replaces it so the newest installed SDK, the preview, is used.
      - name: Use the preview SDK
        run: |
          echo '{ "sdk": { "version": "10.0.100", "rollForward": "latestMajor", "allowPrerelease": true } }' > global.json
          sdk=$(dotnet --version)
          case "$sdk" in
            11.*) ;;
            *) echo "::error::Expected a .NET 11 SDK but got $sdk"; exit 1 ;;
          esac
          echo "SDK: $sdk" >> "$GITHUB_STEP_SUMMARY"

      - name: Compute version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # The package keeps its name and gets a pre-release label, so the stable release always sorts above it.
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            version="${TAG#v}-net11-preview"
          else
            base=$(sed -n 's:.*<Version>\([0-9]*\.[0-9]*\.[0-9]*\).*</Version>.*:\1:p' src/PdfPecker/PdfPecker.csproj)
            version="$base-net11-preview.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version" >> "$GITHUB_STEP_SUMMARY"

      - run: dotnet build -c Release -f $PREVIEW_TFM -p:PreviewTargetFramework=$PREVIEW_TFM tests/PdfPecker.Tests
      - run: dotnet test -c Release -f $PREVIEW_TFM --no-build -p:PreviewTargetFramework=$PREVIEW_TFM tests/PdfPecker.Tests

      - name: Pack with the preview target
        run: dotnet pack src/PdfPecker -c Release -p:PreviewTargetFramework=$PREVIEW_TFM -p:Version=${{ steps.version.outputs.version }} -o artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PdfPecker.${{ steps.version.outputs.version }}.nupkg
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
