name: .NET preview

# Builds and tests PdfPecker on the latest .NET 12 preview SDK with an extra net12.0 target, so a break in the next
# .NET shows up long before it ships. Nothing is packed: a package built against preview reference assemblies should
# not ship, and .NET 12 already runs the net11.0 build, so net12.0 joins the released package once .NET 12 is
# generally available, as net11.0 did with .NET 11. Until Microsoft publishes the first .NET 12 preview the job only
# reports that there is none. The job never blocks a pull request or a release: preview SDKs change between drops, and a
# failure here is a heads-up, not a reason to hold back a stable release. It runs on main and weekly rather than on
# every pull request, since a preview break is rarely caused by the change under review.
#
# Paused after .NET 11 shipped, until Microsoft publishes the first .NET 12 preview (usually in February): only a run by
# hand starts it. To turn it back on, put back these triggers above workflow_dispatch:
#
#   push:
#     branches: [main]
#     paths:
#       - src/**
#       - tests/**
#       - .github/workflows/dotnet-preview.yml
#   release:
#     types: [published]
#   schedule:
#     - cron: "41 4 * * 1" # Mondays, so a new preview drop is tried within a week
on:
  workflow_dispatch:

permissions:
  contents: read

# A PR's newer push replaces its older run. Every push to main runs on its own: with one group for main, GitHub keeps
# only the newest waiting run and cancels the others, so commits merged minutes apart got no result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PREVIEW_TFM: net12.0
  PREVIEW_VERSION: "12.0"

jobs:
  next:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # The preview SDK ships together with the runtime's reference pack, so its first preview on nuget.org is the sign
      # that setup-dotnet can install one.
      - name: Look for a preview
        id: preview
        run: |
          if curl -sSf https://api.nuget.org/v3-flatcontainer/microsoft.netcore.app.ref/index.json \
              | jq -e --arg v "$PREVIEW_VERSION." 'any(.versions[]; startswith($v))' > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No .NET $PREVIEW_VERSION preview yet." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.preview.outputs.found == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.preview.outputs.found == 'true'
        with:
          dotnet-version: 12.0.x
          dotnet-quality: preview
          # Keeps ~/.nuget/packages between runs. Every restore of src/PdfPecker fetches the API baseline release for
          # package validation, so without the cache each job downloaded it from nuget.org again.
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props

      # global.json pins the .NET 11 SDK; this run replaces it so the newest installed SDK, the preview, is used.
      - name: Use the preview SDK
        if: steps.preview.outputs.found == 'true'
        run: |
          echo '{ "sdk": { "version": "11.0.100", "rollForward": "latestMajor", "allowPrerelease": true } }' > global.json
          sdk=$(dotnet --version)
          case "$sdk" in
            12.*) ;;
            *) echo "::error::Expected a .NET 12 SDK but got $sdk"; exit 1 ;;
          esac
          echo "SDK: $sdk" >> "$GITHUB_STEP_SUMMARY"

      - if: steps.preview.outputs.found == 'true'
        run: dotnet build -c Release -f $PREVIEW_TFM -p:PreviewTargetFramework=$PREVIEW_TFM tests/PdfPecker.Tests
      - if: steps.preview.outputs.found == 'true'
        run: dotnet test -c Release -f $PREVIEW_TFM --no-build -p:PreviewTargetFramework=$PREVIEW_TFM tests/PdfPecker.Tests

