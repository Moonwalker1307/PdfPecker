name: .NET preview

# Builds and tests PdfPecker on the latest .NET 11 preview SDK with an extra net11.0 target, so a break in the next
# .NET shows up long before it ships. Nothing is packed: a package built against preview reference assemblies should
# not ship, and .NET 11 already runs the net10.0 build, so net11.0 joins the released package once .NET 11 is
# generally available. The job never blocks a pull request or a release: preview SDKs change between drops, and a
# failure here is a heads-up, not a reason to hold back a stable release.
on:
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: "41 4 * * 1" # Mondays, so a new preview drop is tried within a week
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PREVIEW_TFM: net11.0

jobs:
  net11:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      # global.json pins the .NET 10 SDK; this run replaces it so the newest installed SDK, the preview, is used.
      - name: Use the preview SDK
        run: |
          echo '{ "sdk": { "version": "10.0.100", "rollForward": "latestMajor", "allowPrerelease": true } }' > global.json
          sdk=$(dotnet --version)
          case "$sdk" in
            11.*) ;;
            *) echo "::error::Expected a .NET 11 SDK but got $sdk"; exit 1 ;;
          esac
          echo "SDK: $sdk" >> "$GITHUB_STEP_SUMMARY"

      - run: dotnet build -c Release -f $PREVIEW_TFM -p:PreviewTargetFramework=$PREVIEW_TFM tests/PdfPecker.Tests
      - run: dotnet test -c Release -f $PREVIEW_TFM --no-build -p:PreviewTargetFramework=$PREVIEW_TFM tests/PdfPecker.Tests

