name: CodeQL

on:
  pull_request:
    branches: [main]
  # Also after each merge, so the alerts for main are never a week old.
  push:
    branches: [main]
    paths:
      - src/**
      - .github/workflows/codeql.yml
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main are never cancelled, so every merged commit gets a
# result even when two pull requests merge close together.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # uploads the results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: csharp
          build-mode: manual

      # Only the shipped library is analysed; tests, samples and tools are not part of the package.
      - run: dotnet build -c Release -f net10.0 src/PdfPecker

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:csharp
