<html><body style="font-family:Arial">
<h3>CSS gradients</h3>
<div style="display:flex; gap:8px; flex-wrap:wrap">
 <div style="width:120px;height:60px;background:linear-gradient(to right, red, blue)"></div>
 <div style="width:120px;height:60px;background:linear-gradient(45deg, #ff0 0%, #0a0 50%, #00f 100%)"></div>
 <div style="width:120px;height:60px;background:linear-gradient(to bottom right, white, black)"></div>
 <div style="width:120px;height:60px;background-image:radial-gradient(circle, #fff, #08f)"></div>
 <div style="width:120px;height:60px;background:radial-gradient(ellipse at top left, orange, purple)"></div>
 <div style="width:120px;height:60px;background:repeating-linear-gradient(45deg, #eee 0 10px, #c00 10px 20px)"></div>
 <div style="width:120px;height:60px;background:repeating-radial-gradient(circle, #000 0 5px, #fff 5px 10px)"></div>
 <div style="width:120px;height:60px;background:linear-gradient(rgba(0,0,0,0.5), transparent), #3a3"></div>
</div>
<h3>SVG</h3>
<svg width="600" height="200" viewBox="0 0 600 200">
 <defs>
  <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f00"/><stop offset="1" stop-color="#00f"/></linearGradient>
  <radialGradient id="rg" cx="50%" cy="50%" r="50%" fx="30%" fy="30%"><stop offset="0%" style="stop-color:white"/><stop offset="100%" style="stop-color:green"/></radialGradient>
  <linearGradient id="rep" x1="0" x2="20" gradientUnits="userSpaceOnUse" spreadMethod="reflect"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fc0"/></linearGradient>
  <clipPath id="cp"><circle cx="350" cy="60" r="50"/></clipPath>
 </defs>
 <rect x="10" y="10" width="100" height="100" fill="url(#lg)" stroke="black"/>
 <circle cx="180" cy="60" r="50" fill="url(#rg)"/>
 <g clip-path="url(#cp)"><rect x="290" y="0" width="120" height="60" fill="orange"/><rect x="290" y="60" width="120" height="60" fill="teal"/></g>
 <rect x="420" y="10" width="160" height="40" fill="url(#rep)"/>
 <text x="10" y="150" font-size="20" fill="#333">Left <tspan font-weight="bold" fill="red">bold</tspan> text</text>
 <text x="300" y="150" font-size="16" text-anchor="middle" font-family="Times">Centered</text>
 <text x="590" y="150" font-size="16" text-anchor="end" fill="url(#lg)" font-weight="bold">Gradient end</text>
 <text x="300" y="185" font-size="14" dominant-baseline="middle" text-anchor="middle" transform="rotate(-5 300 185)">Rotated, middle baseline</text>
 <line x1="0" y1="185" x2="600" y2="185" stroke="#ccc"/>
</svg>
<h3>Named grid areas</h3>
<div style="display:grid; grid-template-areas:'head head' 'side main' 'foot foot'; grid-template-columns:100px 1fr; gap:4px">
 <div style="grid-area:main;background:#cfc">main</div>
 <div style="grid-area:head;background:#ccf">head</div>
 <div style="grid-area:foot;background:#fcc">foot</div>
 <div style="grid-area:side;background:#ffc">side</div>
</div>
<div style="display:grid; grid-template-columns:[a] 50px [b] 100px [c] 1fr [d]; margin-top:6px">
 <div style="grid-column: b / d; background:#ddd">b to d</div>
 <div style="grid-column-start: a; grid-column-end: span 1; background:#aaa">a</div>
</div>
</body></html>
