<!doctype html><html><head><style>
body { font-family: Helvetica, Arial, sans-serif; margin: 0; padding: 20px; }
.row { display: flex; gap: 12px; margin-bottom: 12px; }
.box { width: 220px; height: 130px; border: 4px dashed #555; padding: 10px; font-size: 12px; color: #000; background-color: #eef; }
.a { background: #fff url(logo.png) no-repeat center / contain; }
.b { background: url(logo.png) no-repeat right 10px bottom 10px / 60px auto, #ffd; }
.c { background-image: url(dots.png); }
.d { background: url(dots.png) space, #fee; }
.e { background: url(dots.png) round; background-size: 20px; }
.f { background: url(stripe.png) repeat-x 0 50%, linear-gradient(#ccf, #fff); }
.g { background: url(logo.png) no-repeat 0 0 / cover; background-origin: content-box; background-clip: content-box; }
.h { background: linear-gradient(45deg, #f80 25%, transparent 25%, transparent 75%, #f80 75%) 0 0 / 24px 24px, #fff; }
.i { background: url(dots.png) repeat-y center top, url(stripe.png) no-repeat 20% 80% / 50px 30px, #efe; background-clip: padding-box; }
</style></head><body>
<div class="row"><div class="box a">contain, centred</div><div class="box b">right 10px bottom 10px, 60px</div><div class="box c">repeat (PNG alpha)</div></div>
<div class="row"><div class="box d">space</div><div class="box e">round</div><div class="box f">repeat-x over gradient</div></div>
<div class="row"><div class="box g">cover, content-box</div><div class="box h">sized gradient tiles</div><div class="box i">two layers, padding-box clip</div></div>
</body></html>
