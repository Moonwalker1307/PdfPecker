<!doctype html>
<html lang="en"><head><title>Masks, backdrop filters and 3D transforms</title>
<style>
@page { size: 148mm 210mm; margin: 12mm }
body { font: 9pt/1.4 sans-serif; margin: 0; color: #222 }
h1 { font-size: 15pt; margin: 0 0 6pt; border-bottom: 1pt solid #d35400 }
h2 { font-size: 10pt; margin: 8pt 0 3pt; color: #d35400 }
.row { display: flex; gap: 4mm; align-items: flex-start }
.tile { width: 28mm; height: 20mm; font-weight: bold; color: #fff; display: flex; align-items: center; justify-content: center; text-align: center }
.photo { background: linear-gradient(135deg, #1abc9c, #2980b9 50%, #8e44ad) }
.fade { -webkit-mask-image: linear-gradient(to right, #000, transparent); mask-image: linear-gradient(to right, #000, transparent) }
.spot { mask-image: radial-gradient(circle at center, #000 45%, transparent 46%) }
.stripes { mask-image: repeating-linear-gradient(45deg, #000 0 4px, transparent 4px 8px) }
.sized { mask-image: radial-gradient(circle, #000 60%, transparent 62%); mask-size: 5mm 5mm; mask-repeat: repeat }
.backdrop { position: relative; width: 120mm; height: 26mm; background: repeating-linear-gradient(90deg, #e74c3c 0 6mm, #f1c40f 6mm 12mm, #3498db 12mm 18mm) }
.glass { position: absolute; top: 4mm; height: 18mm; width: 30mm; display: flex; align-items: center; justify-content: center; font-weight: bold; border: 0.5pt solid #fff }
.blur { left: 4mm; backdrop-filter: blur(3px); background: rgba(255,255,255,0.25) }
.gray { left: 45mm; backdrop-filter: grayscale(1) }
.inv { left: 86mm; backdrop-filter: invert(1) brightness(0.9) }
.stage { perspective: 300px; display: inline-block; margin: 2mm 3mm }
.card { width: 26mm; height: 18mm; background: #2c6e9b; color: #fff; display: flex; align-items: center; justify-content: center; border: 1pt solid #1b4f72 }
.ry { transform: rotateY(40deg) }
.rx { transform: rotateX(45deg) }
.r3 { transform: rotate3d(1, 1, 0, 35deg) }
.flat { transform: translateZ(20px) }
.turned { display: inline-block; margin: 6mm 4mm 2mm; width: 28mm; height: 14mm; background: linear-gradient(to right, #c0392b, #f39c12); transform: rotate(-12deg) }
.scaled { display: inline-block; margin: 2mm 4mm; width: 20mm; height: 14mm; background: repeating-linear-gradient(90deg, #333 0 2mm, #eee 2mm 4mm); transform: scale(1.4, 0.8) skewX(15deg) }
</style></head>
<body>
<h1>Masks, backdrop filters and 3D transforms</h1>

<h2>mask-image</h2>
<div class="row">
  <div class="tile photo fade">fade</div>
  <div class="tile photo spot">spot</div>
  <div class="tile photo stripes">stripes</div>
  <div class="tile photo sized">mask-size</div>
</div>

<h2>backdrop-filter</h2>
<div class="backdrop">
  <div class="glass blur">blur</div>
  <div class="glass gray">grayscale</div>
  <div class="glass inv">invert</div>
</div>

<h2>3D transforms drawn flat</h2>
<div class="stage"><div class="card ry">rotateY</div></div>
<div class="stage"><div class="card rx">rotateX</div></div>
<div class="stage"><div class="card r3">rotate3d</div></div>
<div class="stage"><div class="card flat">translateZ</div></div>

<h2>Gradients in transformed boxes</h2>
<div class="turned"></div><div class="scaled"></div>
</body></html>
