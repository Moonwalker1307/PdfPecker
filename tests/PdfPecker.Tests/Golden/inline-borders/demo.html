<!DOCTYPE html>
<html lang="en">
<head>
<title>Borders of inline boxes</title>
<style>
  @page { size: 148mm 105mm; margin: 10mm; }
  body { font-family: sans-serif; font-size: 14px; }
  p { width: 300px; line-height: 1.8; }
  .status { border: 1px solid #c00; border-radius: 3px; padding: 1px 4px; }
  .tag { border: 2px solid #090; background: #efe; padding: 0 3px; }
  .ring { border: 3px solid #c00; border-left-color: #00c; border-right-color: #090; border-radius: 6px; padding: 0 4px; }
  .clone { box-decoration-break: clone; -webkit-box-decoration-break: clone; background: #fee; }
  kbd { border: 1px solid #888; border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; }
  a { color: blue; text-decoration: none; border-bottom: 1px dotted blue; }
  .dashed { border: 2px dashed #555; }
  .faded { opacity: .4; border: 2px solid #000; }
</style>
</head>
<body>
<p>Status: <span class="status">Overdue</span> and a <span class="tag">tag that is long enough to wrap onto the next line</span> end.</p>
<p>Slice: <span class="ring">this rounded box breaks across two lines</span> end.</p>
<p>Clone: <span class="ring clone">this rounded box breaks across two lines</span> end.</p>
<p>Press <kbd>Ctrl</kbd> + <kbd>C</kbd>, follow the <a href="#x">link</a>, a <span class="dashed">dashed box</span> and a <span class="faded">faded one</span>.</p>
</body>
</html>
