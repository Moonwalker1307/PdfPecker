<!doctype html>
<html><head><title>SVG charts</title>
<style>
@page { size: A4; margin: 15mm }
body { font: 9pt sans-serif; margin: 0 }
h1 { font-size: 14pt; margin: 0 0 6pt }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm }
figure { margin: 0; border: 0.5pt solid #ccc; padding: 4pt; break-inside: avoid }
figcaption { font-weight: bold; margin-bottom: 3pt }
svg { width: 100%; height: auto; display: block }
</style></head>
<body>
<h1>SVG charts, masks and patterns</h1>
<div class="grid">
<figure><figcaption>Bar chart with a gradient and labels</figcaption>
<svg viewBox="0 0 270 195"><defs><linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#457b9d"/><stop offset="1" stop-color="#a8dadc"/></linearGradient></defs>
<g stroke="#ddd"><line x1="25" x2="260" y1="170" y2="170"/><line x1="25" x2="260" y1="140" y2="140"/><line x1="25" x2="260" y1="110" y2="110"/><line x1="25" x2="260" y1="80" y2="80"/><line x1="25" x2="260" y1="50" y2="50"/><line x1="25" x2="260" y1="20" y2="20"/></g>
<line x1="25" y1="10" x2="25" y2="170" stroke="#333"/><line x1="25" y1="170" x2="260" y2="170" stroke="#333"/>
<rect x="30" y="110" width="18" height="60" fill="url(#bar)"/><text x="39" y="184" text-anchor="middle" font-size="9">Q1</text><text x="39" y="105" text-anchor="middle" font-size="8">60</text><rect x="58" y="75" width="18" height="95" fill="url(#bar)"/><text x="67" y="184" text-anchor="middle" font-size="9">Q2</text><text x="67" y="70" text-anchor="middle" font-size="8">95</text><rect x="86" y="50" width="18" height="120" fill="url(#bar)"/><text x="95" y="184" text-anchor="middle" font-size="9">Q3</text><text x="95" y="45" text-anchor="middle" font-size="8">120</text><rect x="114" y="90" width="18" height="80" fill="url(#bar)"/><text x="123" y="184" text-anchor="middle" font-size="9">Q4</text><text x="123" y="85" text-anchor="middle" font-size="8">80</text><rect x="142" y="30" width="18" height="140" fill="url(#bar)"/><text x="151" y="184" text-anchor="middle" font-size="9">Q5</text><text x="151" y="25" text-anchor="middle" font-size="8">140</text><rect x="170" y="60" width="18" height="110" fill="url(#bar)"/><text x="179" y="184" text-anchor="middle" font-size="9">Q6</text><text x="179" y="55" text-anchor="middle" font-size="8">110</text><rect x="198" y="20" width="18" height="150" fill="url(#bar)"/><text x="207" y="184" text-anchor="middle" font-size="9">Q7</text><text x="207" y="15" text-anchor="middle" font-size="8">150</text><rect x="226" y="40" width="18" height="130" fill="url(#bar)"/><text x="235" y="184" text-anchor="middle" font-size="9">Q8</text><text x="235" y="35" text-anchor="middle" font-size="8">130</text></svg></figure>
<figure><figcaption>Line chart with markers and a dashed trend</figcaption>
<svg viewBox="0 0 280 190"><defs><marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#e63946"/></marker>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<polyline points="20,175 270,175" stroke="#333" marker-end="url(#arrow)" fill="none"/>
<path d="M30.0,150.0 L60.0,116.2 L90.0,89.5 L120.0,75.2 L150.0,75.4 L180.0,89.1 L210.0,111.5 L240.0,136.0 L270.0,155.4" fill="none" stroke="#e63946" stroke-width="2" marker-start="url(#dot)" marker-mid="url(#dot)" marker-end="url(#dot)"/>
<path d="M30,150 L270,60" stroke="#888" stroke-dasharray="6 3" fill="none"/>
<text x="150" y="20" text-anchor="middle" font-size="11" font-weight="bold">Growth</text></svg></figure>
<figure><figcaption>Pie chart with a legend</figcaption>
<svg viewBox="0 0 260 160"><path d="M80,80 L80.00,20.00 A60,60 0 0,1 128.54,115.27 Z" fill="#e63946" stroke="white" stroke-width="2"/><path d="M80,80 L128.54,115.27 A60,60 0 0,1 44.73,128.54 Z" fill="#f4a261" stroke="white" stroke-width="2"/><path d="M80,80 L44.73,128.54 A60,60 0 0,1 22.94,61.46 Z" fill="#2a9d8f" stroke="white" stroke-width="2"/><path d="M80,80 L22.94,61.46 A60,60 0 0,1 80.00,20.00 Z" fill="#457b9d" stroke="white" stroke-width="2"/>
<rect x="160" y="30" width="12" height="12" fill="#e63946"/><text x="178" y="40" font-size="10">North 35%</text><rect x="160" y="52" width="12" height="12" fill="#f4a261"/><text x="178" y="62" font-size="10">South 25%</text><rect x="160" y="74" width="12" height="12" fill="#2a9d8f"/><text x="178" y="84" font-size="10">East 20%</text><rect x="160" y="96" width="12" height="12" fill="#457b9d"/><text x="178" y="106" font-size="10">West 20%</text></svg></figure>
<figure><figcaption>Pattern fill, mask and clip path</figcaption>
<svg viewBox="0 0 260 160"><defs>
<pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="8" fill="#457b9d"/></pattern>
<pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="3" fill="#e76f51"/></pattern>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="white"/><stop offset="1" stop-color="black"/></linearGradient>
<mask id="m"><rect width="260" height="160" fill="url(#fade)"/></mask>
<clipPath id="star"><path d="M190,15 L203,55 L245,55 L211,80 L224,120 L190,95 L156,120 L169,80 L135,55 L177,55 Z"/></clipPath></defs>
<rect x="10" y="10" width="110" height="60" fill="url(#hatch)" stroke="#333"/>
<rect x="10" y="85" width="110" height="60" fill="url(#dots)" stroke="#333"/>
<g mask="url(#m)"><rect x="10" y="10" width="110" height="135" fill="#2a9d8f" opacity="0.6"/></g>
<rect x="130" y="10" width="120" height="120" fill="url(#hatch)" clip-path="url(#star)"/>
<text x="190" y="148" text-anchor="middle" font-size="10">clipped to a star</text></svg></figure>
<figure style="grid-column: span 2"><figcaption>Stacked area chart with transparency and text on a path</figcaption>
<svg viewBox="0 0 540 170"><defs><path id="curve" d="M20,150 C150,20 390,20 520,150"/></defs>
<path d="M20,160 L20,120 L110,90 L200,100 L290,60 L380,80 L470,40 L520,50 L520,160 Z" fill="#457b9d" fill-opacity="0.5"/>
<path d="M20,160 L20,140 L110,120 L200,130 L290,100 L380,115 L470,90 L520,95 L520,160 Z" fill="#e9c46a" fill-opacity="0.7"/>
<text font-size="12" fill="#264653"><textPath href="#curve" startOffset="50%" text-anchor="middle">Text that follows a curved path</textPath></text>
<g font-size="8" fill="#555"><text x="20" y="168">2019</text><text x="110" y="168">2020</text><text x="200" y="168">2021</text><text x="290" y="168">2022</text><text x="380" y="168">2023</text><text x="470" y="168">2024</text></g></svg></figure>
</div>
</body></html>
