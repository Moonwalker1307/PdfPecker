<html><body style="margin:10px;font-family:Helvetica">
<svg width="760" height="230" viewBox="0 0 760 230" style="display:block">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d33"/>
    </marker>
    <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4" markerUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3" fill="#36c"/>
    </marker>
    <pattern id="checks" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#f90"/><rect x="10" y="10" width="10" height="10" fill="#f90"/>
    </pattern>
    <pattern id="dots" width=".25" height=".25" patternContentUnits="objectBoundingBox">
      <circle cx=".125" cy=".125" r=".08" fill="#393"/>
    </pattern>
    <pattern id="stripes" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="4" height="8" fill="#669"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="white"/><stop offset="1" stop-color="black"/></linearGradient>
    <mask id="m1"><rect x="0" y="0" width="1" height="1" fill="url(#fade)" transform="scale(1)"/></mask>
    <mask id="m2" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#fade)"/></mask>
    <mask id="m3"><circle cx="560" cy="70" r="40" fill="white"/><circle cx="560" cy="70" r="20" fill="black"/></mask>
  </defs>
  <path d="M20 40 L120 40 L150 100" fill="none" stroke="#333" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <polyline points="20,150 60,120 100,170 140,130" fill="none" stroke="#333" marker-start="url(#dot)" marker-mid="url(#dot)" marker-end="url(#dot)"/>
  <path d="M40 200 A 30 20 0 0 1 120 200" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)" marker-mid="url(#dot)"/>
  <rect x="180" y="20" width="100" height="80" fill="url(#checks)" stroke="#000"/>
  <circle cx="230" cy="160" r="50" fill="url(#dots)" stroke="#393"/>
  <rect x="300" y="20" width="100" height="80" fill="url(#stripes)"/>
  <rect x="300" y="120" width="100" height="80" fill="none" stroke="url(#checks)" stroke-width="12"/>
  <rect x="420" y="20" width="100" height="80" fill="#c00" mask="url(#m2)"/>
  <rect x="520" y="30" width="80" height="80" fill="#06c" mask="url(#m3)"/>
  <g mask="url(#m2)"><text x="420" y="160" font-size="40" font-weight="bold" fill="#080">Mask</text></g>
  <rect x="620" y="20" width="120" height="80" fill="#fc0" fill-opacity=".5"/>
  <rect x="660" y="50" width="80" height="80" fill="#06c" fill-opacity=".5"/>
</svg>
<svg width="760" height="200" viewBox="0 0 760 200" style="display:block">
  <defs>
    <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="4" dy="4" stdDeviation="3" flood-color="#000" flood-opacity=".5"/></filter>
    <filter id="classic">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dx="5" dy="5" result="o"/>
      <feFlood flood-color="#08f" flood-opacity=".6"/><feComposite in2="o" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gray"><feColorMatrix type="saturate" values="0"/></filter>
    <filter id="hue"><feColorMatrix type="hueRotate" values="120"/></filter>
    <filter id="thick"><feMorphology operator="dilate" radius="2"/></filter>
    <filter id="post"><feComponentTransfer><feFuncR type="discrete" tableValues="0 .5 1"/><feFuncG type="table" tableValues="1 0"/></feComponentTransfer></filter>
  </defs>
  <circle cx="60" cy="60" r="40" fill="#c33" filter="url(#blur)"/>
  <rect x="130" y="20" width="90" height="80" rx="10" fill="#fd0" stroke="#963" filter="url(#shadow)"/>
  <text x="250" y="75" font-size="40" font-weight="bold" fill="#c33" filter="url(#classic)">Pecker</text>
  <g filter="url(#gray)"><rect x="420" y="20" width="50" height="80" fill="#c33"/><rect x="470" y="20" width="50" height="80" fill="#3c3"/></g>
  <g filter="url(#hue)"><rect x="540" y="20" width="50" height="80" fill="#c33"/><rect x="590" y="20" width="50" height="80" fill="#3c3"/></g>
  <text x="20" y="170" font-size="30" fill="#036" filter="url(#thick)">Dilated</text>
  <rect x="200" y="130" width="200" height="50" fill="url(#fadeh)" filter="url(#post)"/>
  <linearGradient id="fadeh"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>
</svg>
