<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PdfPecker – HTML and Markdown to PDF</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="site.css">
</head>
<body>
<header>
  <h1><img class="logo" src="logo.png" alt="" width="40" height="40">PdfPecker</h1>
  <span class="tag">HTML and Markdown to PDF in milliseconds. Nothing is stored.</span>
</header>

<div class="toolbar">
  <label>Example
    <select id="example">
      <option value="invoice">Invoice</option>
      <option value="article">Article</option>
      <option value="readme">Markdown README</option>
      <option value="blank">Blank</option>
    </select>
  </label>
  <label>Input
    <select id="inputFormat">
      <option value="html">HTML</option>
      <option value="markdown">Markdown</option>
    </select>
  </label>
  <label>Output
    <select id="output">
      <option value="pdf">PDF</option>
      <option value="html" disabled>HTML</option>
    </select>
  </label>
  <label>Page
    <select id="pageSize">
      <option>A4</option><option>Letter</option><option>Legal</option><option>A3</option><option>A5</option>
    </select>
  </label>
  <label><input type="checkbox" id="landscape"> Landscape</label>
  <label>Margin (mm) <input type="number" id="margin" value="12.7" min="0" max="50" step="0.1"></label>
  <label><input type="checkbox" id="pageNumbers" checked> Page numbers</label>
  <label>Watermark <input type="text" id="watermark" size="10" maxlength="200" placeholder="none"></label>
  <label>Password <input type="password" id="password" size="8" autocomplete="new-password" placeholder="none"></label>
  <label title="Archival PDF/A-2b; cannot be combined with a password"><input type="checkbox" id="pdfa"> PDF/A</label>
  <span class="spacer"></span>
  <label class="button" for="file">Open file</label>
  <input type="file" id="file" accept=".html,.htm,.md,.markdown,text/html,text/markdown" hidden>
  <button class="primary" id="convert" title="Ctrl+Enter">Convert</button>
</div>

<main>
  <section class="pane">
    <div class="pane-head"><span id="inputLabel">HTML</span> <span class="spacer"></span><span>Drop an .html or .md file here, or press <kbd>Ctrl</kbd>+<kbd>Enter</kbd> to convert</span></div>
    <textarea id="html" spellcheck="false" aria-label="Document to convert"></textarea>
  </section>
  <section class="pane">
    <div class="pane-head">
      <span id="outputLabel">PDF</span> <span class="status" id="status"></span>
      <span class="spacer"></span>
      <a class="button" id="download" hidden>Download</a>
    </div>
    <div class="empty" id="empty">Your PDF will appear here.</div>
    <iframe id="preview" title="Preview" hidden></iframe>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
