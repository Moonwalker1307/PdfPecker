# Advisories the daily vulnerability scan leaves out, for the veraPDF validator only. greenfield-apps 1.28.2, the
# latest release of veraPDF's command-line apps, is a fat jar with its own copies of veraPDF's parser and validation
# model 1.28.2, Jackson 2.15.0 and Rhino 1.7.13 inside it, so pinning newer versions here changes nothing (a newer
# Jackson next to the bundled one breaks the validator). The fixes need a new veraPDF release, which Dependabot will
# propose. The validator runs only in the conformance workflow on PdfPecker's own sample PDFs, and nothing here ships.
# Each entry expires, so the scan reports it again if veraPDF still has no fix by then.

[[IgnoredVulns]]
id = "GHSA-7c26-995w-6f47"
ignoreUntil = 2027-01-07
reason = "In veraPDF's own parser or validation model 1.28.2, fixed in 1.30.2, which no greenfield-apps release uses yet; CI-only validator of our own PDFs."

