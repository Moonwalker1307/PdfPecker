# and validation model 1.28.2 and fixed in 1.30.2, but no release of org.verapdf.apps:greenfield-apps uses 1.30 yet,
# so there is nothing to update to. The validator runs only in the conformance workflow on PdfPecker's own sample
# PDFs, and nothing here ships. Each entry expires, so the scan reports it again if veraPDF still has no fix by then.

